---
name: CI

# yamllint disable-line
on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - MAINTAINERS.md
      - LICENSE
      - NOTICE
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: write
  packages: write

jobs:
  ci:
    # yamllint disable-line
    uses: xmidt-org/shared-go/.github/workflows/ci.yml@7f729aa96350db9c0120bc3eb07f4fc062a77508 # v4.13.2
    with:
      release-type: library
      yaml-lint-skip: false
    secrets: inherit
